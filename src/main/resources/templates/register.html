<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create an account</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div id="account-form" class="container">
      <h2>Sign Up</h2>
      <div th:if="${errorMessage}" class="error">
        <p th:text="${errorMessage}"></p>
      </div>
      <form
        th:action="@{/auth/register}"
        th:object="${user}"
        method="post"
        id="account-form-fields"
      >
        <div class="input_form">
          <p>Name:</p>
          <input type="text" th:field="*{username}" required />
          <span th:errors="*{username}" class="error"></span>
        </div>
        <div class="input_form">
          <p>Email:</p>
          <input type="email" th:field="*{email}" required />
          <span th:errors="*{email}" class="error"></span>
        </div>
        <div class="input_form">
          <p>Password:</p>
          <input type="password" th:field="*{password}" required />
          <span th:errors="*{password}" class="error"></span>
        </div>
        <button class="button-spec" id="generate-button" type="submit">
          Create
        </button>
      </form>
    </div>
  </body>
</html>
